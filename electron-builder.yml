appId: com.minbbb.wireproxy-awg-gui
productName: wireproxy-awg GUI

directories:
  output: dist

files:
  - index.js
  - preload.js
  - profiles.js
  - settings.js
  - tray.js
  - renderer/**
  - icon.png
  - package.json

extraResources:
  - from: bin/wireproxy.exe
    to: bin/wireproxy.exe

win:
  icon: icon.png
  target: portable